name: Frontend CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/frontend-ci.yml'
      - 'storefront-shell/**'
      - 'catalog-mf/**'
      - 'cart-mf/**'
      - 'account-mf/**'
      - 'admin-mf/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/frontend-ci.yml'
      - 'storefront-shell/**'
      - 'catalog-mf/**'
      - 'cart-mf/**'
      - 'account-mf/**'
      - 'admin-mf/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'nx.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build Frontend Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      storefront_changed: ${{ steps.detect-storefront.outputs.storefront_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Verify Nx projects
        run: pnpm nx show projects

      - name: Lint affected projects
        run: pnpm nx affected --target=lint --base="$NX_BASE" --head="$NX_HEAD" --parallel=3

      - name: Build affected projects
        run: pnpm nx affected --target=build --base="$NX_BASE" --head="$NX_HEAD" --parallel=3

      - name: Detect storefront-shell changes
        id: detect-storefront
        run: |
          set -euo pipefail
          # Force deploy on manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "storefront_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AFFECTED=$(pnpm nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD")
          # Also force deploy if the workflow file itself changed
          CHANGED_FILES=$(git diff --name-only "$NX_BASE" "$NX_HEAD" 2>/dev/null || true)
          if echo "$AFFECTED" | tr ' ' '\n' | grep -qx 'storefront-shell' || \
             echo "$CHANGED_FILES" | grep -q '.github/workflows/frontend-ci.yml'; then
            echo "storefront_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "storefront_changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-storefront-shell:
    name: Deploy Storefront Shell To EC2
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 30
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.lint-and-build.outputs.storefront_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::861638088375:role/github-actions-deploy-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push storefront-shell image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_STOREFRONT_SHELL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f storefront-shell/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" storefront-shell
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy on EC2 via SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          HOST_FRONTEND_PORT: ${{ secrets.HOST_FRONTEND_PORT }}
          CART_MF_URL: ${{ secrets.CART_MF_URL }}
          ACCOUNT_MF_URL: ${{ secrets.ACCOUNT_MF_URL }}
          ADMIN_MF_URL: ${{ secrets.ADMIN_MF_URL }}
        run: |
          set -euo pipefail
          export HOST_FRONTEND_PORT="${HOST_FRONTEND_PORT:-8088}"
          export CART_MF_URL="${CART_MF_URL:-http://cart-mf:5173}"
          export ACCOUNT_MF_URL="${ACCOUNT_MF_URL:-http://account-mf:5174}"
          export ADMIN_MF_URL="${ADMIN_MF_URL:-http://admin-mf:5175}"

          python3 - <<'PY' > ssm-commands.json
          import json
          import os

          commands = [
            "sudo docker network create ecommerce-net || true",
            "aws ecr get-login-password --region ap-southeast-1 | sudo docker login --username AWS --password-stdin 861638088375.dkr.ecr.ap-southeast-1.amazonaws.com",
            f"sudo docker pull {os.environ['IMAGE_URI']}",
            "sudo docker rm -f storefront-shell || true",
            (
              "sudo docker run -d --name storefront-shell --restart unless-stopped "
              "--network ecommerce-net "
              f"-p {os.environ['HOST_FRONTEND_PORT']}:3000 "
              f"-e CART_MF_URL={os.environ['CART_MF_URL']} "
              f"-e ACCOUNT_MF_URL={os.environ['ACCOUNT_MF_URL']} "
              f"-e ADMIN_MF_URL={os.environ['ADMIN_MF_URL']} "
              f"{os.environ['IMAGE_URI']}"
            ),
            "sudo docker ps --filter name=storefront-shell --format '{{.Names}} {{.Status}}'",
          ]

          print(json.dumps({"commands": commands}))
          PY

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy storefront-shell from GitHub Actions" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
