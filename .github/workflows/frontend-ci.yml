name: Frontend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build Frontend Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Nx projects
        run: pnpm nx show projects

      - name: Lint apps
        run: pnpm nx run-many --target=lint --projects=storefront-shell,catalog-mf,cart-mf,account-mf,admin-mf --parallel=3

      - name: Build apps
        run: pnpm nx run-many --target=build --projects=storefront-shell,catalog-mf,cart-mf,account-mf,admin-mf --parallel=3

  deploy-storefront-shell:
    name: Deploy Storefront Shell To EC2
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 30
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push storefront-shell image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_STOREFRONT_SHELL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f storefront-shell/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" storefront-shell
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy on EC2 via SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          HOST_FRONTEND_PORT: ${{ secrets.HOST_FRONTEND_PORT }}
          CART_MF_URL: ${{ secrets.CART_MF_URL }}
          ACCOUNT_MF_URL: ${{ secrets.ACCOUNT_MF_URL }}
          ADMIN_MF_URL: ${{ secrets.ADMIN_MF_URL }}
        run: |
          : "${HOST_FRONTEND_PORT:=8088}"

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy storefront-shell from GitHub Actions" \
            --parameters commands="sudo docker pull $IMAGE_URI,sudo docker rm -f storefront-shell || true,sudo docker run -d --name storefront-shell --restart unless-stopped -p $HOST_FRONTEND_PORT:3000 -e CART_MF_URL=${CART_MF_URL:-http://localhost:5173} -e ACCOUNT_MF_URL=${ACCOUNT_MF_URL:-http://localhost:5174} -e ADMIN_MF_URL=${ADMIN_MF_URL:-http://localhost:5175} $IMAGE_URI" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
