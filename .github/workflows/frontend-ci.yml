name: Frontend CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build Frontend Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Nx projects
        run: pnpm nx show projects

      - name: Lint apps
        run: pnpm nx run-many --target=lint --projects=storefront-shell,catalog-mf,cart-mf,account-mf,admin-mf --parallel=3

      - name: Build apps
        run: pnpm nx run-many --target=build --projects=storefront-shell,catalog-mf,cart-mf,account-mf,admin-mf --parallel=3
